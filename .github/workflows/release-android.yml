name: Signed Android release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify signed APK
        working-directory: android
        env:
          COZY_KEYSTORE_BASE64: ${{ secrets.COZY_KEYSTORE_BASE64 }}
          COZY_STORE_PASSWORD: ${{ secrets.COZY_STORE_PASSWORD }}
          COZY_KEY_ALIAS: ${{ secrets.COZY_KEY_ALIAS }}
          COZY_KEY_PASSWORD: ${{ secrets.COZY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${COZY_KEYSTORE_BASE64:?Missing permanent release key}"
          export COZY_KEYSTORE_PATH="$RUNNER_TEMP/cozy-release.jks"
          trap 'rm -f "$COZY_KEYSTORE_PATH"' EXIT
          printf '%s' "$COZY_KEYSTORE_BASE64" | base64 --decode > "$COZY_KEYSTORE_PATH"
          chmod 600 "$COZY_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Cozy-Measure.apk
          cd app/build/outputs/apk/release
          sha256sum Cozy-Measure.apk > Cozy-Measure.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Cozy-Measure-signed-Android
          path: |
            android/app/build/outputs/apk/release/Cozy-Measure.apk
            android/app/build/outputs/apk/release/Cozy-Measure.apk.sha256
