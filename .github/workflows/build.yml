name: Build Cozy Measure
on:
  workflow_dispatch:
  push:
    branches: [main, fix/ar-accuracy, fix/cozy-branding]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest
        working-directory: android
      - name: Verify release signing configuration with a disposable test key
        working-directory: android
        run: |
          set -euo pipefail
          export COZY_KEYSTORE_PATH="$RUNNER_TEMP/cozy-ci-only.jks"
          export COZY_STORE_PASSWORD=ci-only-password
          export COZY_KEY_PASSWORD=ci-only-password
          export COZY_KEY_ALIAS=ci-only
          trap 'rm -f "$COZY_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -keystore "$COZY_KEYSTORE_PATH" -storepass "$COZY_STORE_PASSWORD" -keypass "$COZY_KEY_PASSWORD" -alias "$COZY_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Disposable CI Test"
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cozy-Measure-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate && xcodebuild -project CozyMeasure.xcodeproj -scheme CozyMeasure -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/room-bridge.test.cjs
